# /etc/nginx/sites-available/soeaweb  — the live setup (DEPLOY.md step 9).
# Replaces the staging file (nginx-soea.conf) once sq1ecoafrica.org moves to the new site.
#
# One certificate, "sq1ecoafrica.org", covers all four names:
#   sudo certbot certonly --nginx --cert-name sq1ecoafrica.org --expand \
#     -d sq1ecoafrica.org -d www.sq1ecoafrica.org -d new.sq1ecoafrica.org -d api.sq1ecoafrica.org \
#     --deploy-hook "systemctl reload nginx"
#
# The address everyone ends up on is https://sq1ecoafrica.org; www. and new. redirect to it.

# --- Plain HTTP: send everything to HTTPS ------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name sq1ecoafrica.org www.sq1ecoafrica.org new.sq1ecoafrica.org api.sq1ecoafrica.org;

    # (certbot's nginx plugin adds its own challenge answer during renewals.)
    return 301 https://$host$request_uri;
}

# --- www. and new. → the main address ---------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.sq1ecoafrica.org new.sq1ecoafrica.org;

    ssl_certificate /etc/letsencrypt/live/sq1ecoafrica.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sq1ecoafrica.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://sq1ecoafrica.org$request_uri;
}

# --- Website -----------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sq1ecoafrica.org;

    ssl_certificate /etc/letsencrypt/live/sq1ecoafrica.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sq1ecoafrica.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 5m;

    # Next's built files never change once built: cache them for a year.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3020;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}

# --- API ---------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.sq1ecoafrica.org;

    ssl_certificate /etc/letsencrypt/live/sq1ecoafrica.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sq1ecoafrica.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Largest upload is 25 MB (a document), plus form overhead.
    client_max_body_size 27m;

    location / {
        proxy_pass http://127.0.0.1:8020;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}
