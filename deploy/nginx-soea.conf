# /etc/nginx/sites-available/soea  (then: ln -s ... sites-enabled/)
# certbot --nginx adds the HTTPS parts to this file.
#
# Stage 1 (testing): only api. and new. are live here; the old site keeps
# sq1ecoafrica.org and www. Stage 2 (switch-over): DEPLOY.md step 9 adds them.

# --- API ---------------------------------------------------------------
server {
    listen 80;
    server_name api.sq1ecoafrica.org;

    # Largest upload is 25 MB (a document), plus form overhead.
    client_max_body_size 27m;

    location / {
        proxy_pass http://127.0.0.1:8020;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}

# --- Website -----------------------------------------------------------
server {
    listen 80;
    server_name new.sq1ecoafrica.org;

    client_max_body_size 5m;

    # Next's built files never change once built: cache them for a year.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3020;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
